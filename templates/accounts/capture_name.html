{% extends "base.html" %}
{% load static %}

{% block title %}Completa tu perfil – BarberSync{% endblock %}

{% block public_content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm space-y-8">

        <!-- Logo -->
        <div class="text-center">
            <div class="w-16 h-16 bg-brand rounded-2xl flex items-center justify-center mx-auto mb-4
                        shadow-lg shadow-brand/20">
                <span class="text-white font-heading font-bold text-3xl">B</span>
            </div>
            <h1 class="font-heading font-bold text-2xl text-white">Completa tu perfil</h1>
            <p class="text-sm text-neutral-400 mt-1">Necesitamos tu nombre para continuar</p>
        </div>

        <form id="name-form" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="first_name" class="block text-sm font-medium text-neutral-300 mb-1">
                    Nombre <span class="text-brand">*</span>
                </label>
                <input type="text" name="first_name" id="first_name" required
                       class="w-full px-4 py-3 bg-neutral-900 border border-neutral-700 rounded-lg text-white
                              placeholder-neutral-500 focus:ring-2 focus:ring-brand focus:border-brand
                              transition-colors text-sm"
                       placeholder="Tu nombre real" autofocus>
            </div>

            <div>
                <label for="last_name" class="block text-sm font-medium text-neutral-300 mb-1">
                    Apellidos <span class="text-neutral-500">(opcional)</span>
                </label>
                <input type="text" name="last_name" id="last_name"
                       class="w-full px-4 py-3 bg-neutral-900 border border-neutral-700 rounded-lg text-white
                              placeholder-neutral-500 focus:ring-2 focus:ring-brand focus:border-brand
                              transition-colors text-sm"
                       placeholder="Tus apellidos">
            </div>

            <div id="name-error" class="hidden p-3 bg-red-900/40 border border-red-800 rounded-lg text-sm text-red-300"></div>

            <button type="submit" id="save-btn"
                    class="btn-action-primary btn-primary font-semibold w-full text-sm flex items-center justify-center gap-2 border border-neutral-700 px-4 py-3 rounded-lg transition-all shadow-sm">
                <span>Continuar</span>
                <svg id="save-spinner" class="hidden animate-spin h-4 w-4" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </button>
        </form>
    </div>
</div>

<script>
(function() {
    const form = document.getElementById('name-form');
    const errorDiv = document.getElementById('name-error');
    const saveBtn = document.getElementById('save-btn');
    const saveSpinner = document.getElementById('save-spinner');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errorDiv.classList.add('hidden');

        const firstName = document.getElementById('first_name').value.trim();
        const lastName = document.getElementById('last_name').value.trim();

        if (!firstName) {
            errorDiv.textContent = 'Tu nombre es obligatorio.';
            errorDiv.classList.remove('hidden');
            return;
        }

        saveBtn.disabled = true;
        saveSpinner.classList.remove('hidden');

        try {
            const resp = await fetch('{% url "accounts:capture_name" %}', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value},
                body: JSON.stringify({first_name: firstName, last_name: lastName})
            });
            const data = await resp.json();

            if (!resp.ok) {
                errorDiv.textContent = data.error || 'Error al guardar.';
                errorDiv.classList.remove('hidden');
                saveBtn.disabled = false;
                saveSpinner.classList.add('hidden');
                return;
            }

            window.location.href = data.redirect || '/app/schedule/';
        } catch (err) {
            errorDiv.textContent = 'Error de conexión.';
            errorDiv.classList.remove('hidden');
            saveBtn.disabled = false;
            saveSpinner.classList.add('hidden');
        }
    });
})();
</script>
{% endblock %}
