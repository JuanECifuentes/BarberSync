{% extends "base.html" %}
{% load static %}

{% block title %}Inicio de sesión cancelado – BarberSync{% endblock %}

{% block public_content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm space-y-8">

        <!-- Logo -->
        <div class="text-center">
            <div class="w-16 h-16 bg-brand/20 rounded-2xl flex items-center justify-center mx-auto mb-4
                        border border-neutral-700">
                <svg class="w-8 h-8 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </div>
            <h1 class="font-heading font-bold text-2xl text-white">Inicio de sesión cancelado</h1>
            <p class="text-sm text-neutral-400 mt-1">No te preocupes, puedes intentarlo de nuevo</p>
        </div>

        <!-- Actions -->
        <div class="flex flex-col gap-3">
            <a href="{% url 'account_login' %}"
               class="w-full flex items-center justify-center gap-3 border border-neutral-700 px-4 py-3 rounded-lg
                      text-white font-medium hover:bg-[#ff2301] hover:text-white hover:border-[#ff2301]
                      hover:-translate-y-1 hover:shadow-md transition-all duration-300">
                Volver al inicio de sesión
            </a>
            <a href="/book/"
               class="w-full flex items-center justify-center gap-3 border border-neutral-700 px-4 py-3 rounded-lg
                      text-neutral-400 font-medium hover:text-white hover:border-neutral-500
                      transition-all duration-300">
                Volver al inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
