{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff2301">
    <title>{{ error_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#ff2301', 600: '#e01e00', 700: '#b81800' },
                        neutral: { 400: '#b8b8be', 500: '#59595D', 600: '#5e5e63', 700: '#4a4a4f', 800: '#3d3d41', 900: '#2a2a2d', 950: '#1a1a1c' }
                    },
                    fontFamily: { heading: ['Roboto', 'sans-serif'], body: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-[#0f0f11] font-body antialiased flex flex-col items-center justify-center px-4 py-12">
    <div class="w-full max-w-md space-y-8 text-center">

        <!-- Logo -->
        <div class="w-16 h-16 bg-brand rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-brand/20">
            <span class="text-white font-heading font-bold text-3xl">B</span>
        </div>

        <!-- Error Icon -->
        <div class="w-16 h-16 mx-auto bg-red-500/20 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>

        <h1 class="font-heading font-bold text-xl text-white">{{ error_title }}</h1>
        <p class="text-sm text-neutral-400 leading-relaxed">{{ error_message }}</p>

        {% if appointment %}
        <p class="text-xs text-neutral-600">
            Cita: {{ appointment.start_time|date:"d/m/Y" }} a las {{ appointment.start_time|time:"H:i" }}
            — {{ appointment.barbershop.name }}
        </p>
        {% endif %}
    </div>
</body>
</html>
