{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando pago – BarberSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#ff2301', 500: '#ff2301', 600: '#e01e00' },
                        neutral: { DEFAULT: '#59595D', 900: '#2a2a2d', 950: '#1a1a1c' },
                    },
                    fontFamily: { heading: ['Roboto', 'sans-serif'], body: ['Poppins', 'sans-serif'] },
                }
            }
        }
    </script>
</head>
<body class="h-full bg-neutral-950 text-white font-body antialiased flex items-center justify-center min-h-screen">
    <div class="text-center max-w-md mx-auto px-6">
        <div class="w-16 h-16 bg-brand/10 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-brand animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        </div>
        <h1 class="font-heading font-bold text-2xl text-white mb-3">Procesando tu pago</h1>
        <p class="text-neutral-400 text-sm mb-8">{{ message }}</p>
        <a href="/" class="inline-flex items-center gap-2 bg-brand text-white font-semibold px-6 py-3 rounded-xl hover:bg-brand-600 transition-all duration-200">
            Volver al inicio
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
        </a>
    </div>
</body>
</html>
