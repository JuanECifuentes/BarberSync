<!-- Reusable Loading Overlay Component -->
<div x-show="{{ loading_var|default:'loading' }}" x-cloak
     class="absolute inset-0 bg-neutral-950/60 backdrop-blur-[2px] z-50 flex items-center justify-center rounded-xl transition-all duration-300">
    <div class="flex flex-col items-center gap-3 p-6 rounded-2xl shadow-2xl" style="background-color: transparent; border: none;">
        <svg class="animate-spin h-10 w-10 text-brand" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="text-sm font-semibold text-white tracking-wide">{{ loading_text|default:"Cargando..." }}</span>
    </div>
</div>
